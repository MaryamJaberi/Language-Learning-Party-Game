    <link rel="stylesheet" href="./index.css">
    <script>
      (function() {
        if (typeof window === 'undefined') return;

        // 1. Capture & stop propagation on window event listeners
        window.addEventListener('unhandledrejection', function(e) {
          var r = e && e.reason;
          var msg = (r && (r.message || String(r))) || '';
          var stk = (r && r.stack) || '';
          if (msg.includes('WebSocket') || stk.includes('@vite/client') || stk.includes('WebSocket')) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, { capture: true });

        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || String(e))) || '';
          var fn = (e && e.filename) || '';
          if (msg.includes('WebSocket') || fn.includes('@vite/client')) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, { capture: true });

        // 2. Intercept window.onunhandledrejection & window.onerror assignments by AI Studio iframe wrapper
        var _customRejectionHandler = null;
        try {
          var existingRejection = window.onunhandledrejection;
          Object.defineProperty(window, 'onunhandledrejection', {
            configurable: true,
            enumerable: true,
            get: function() { return _customRejectionHandler; },
            set: function(fn) {
              if (typeof fn !== 'function') {
                _customRejectionHandler = fn;
                return;
              }
              _customRejectionHandler = function(event) {
                var reason = event && event.reason;
                var message = (reason && (reason.message || String(reason))) || '';
                var stack = (reason && reason.stack) || '';
                if (message.includes('WebSocket') || stack.includes('@vite/client') || stack.includes('WebSocket')) {
                  if (event && event.preventDefault) event.preventDefault();
                  return; // Silently ignore Vite HMR WebSocket in preview iframe
                }
                return fn.call(this, event);
              };
            }
          });
          if (existingRejection) window.onunhandledrejection = existingRejection;
        } catch(err) {}

        var _customErrorHandler = null;
        try {
          var existingError = window.onerror;
          Object.defineProperty(window, 'onerror', {
            configurable: true,
            enumerable: true,
            get: function() { return _customErrorHandler; },
            set: function(fn) {
              if (typeof fn !== 'function') {
                _customErrorHandler = fn;
                return;
              }
              _customErrorHandler = function(message, source, lineno, colno, error) {
                var msg = String(message || '');
                var src = String(source || '');
                if (msg.includes('WebSocket') || src.includes('@vite/client')) {
                  return true;
                }
                return fn.call(this, message, source, lineno, colno, error);
              };
            }
          });
          if (existingError) window.onerror = existingError;
        } catch(err) {}
      })();
    </script>

        }
    </style>
